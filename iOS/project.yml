name: Screwbox
options:
  bundleIdPrefix: com.shimondeitel.screwbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Screwbox:
    type: application
    platform: iOS
    sources:
      - path: Screwbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.screwbox
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Screwbox/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ScrewboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScrewboxTests
      - path: Screwbox.storekit
    dependencies:
      - target: Screwbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.screwbox.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ScrewboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScrewboxUITests
    dependencies:
      - target: Screwbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.screwbox.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Screwbox:
    build:
      targets:
        Screwbox: all
        ScrewboxTests: [test]
        ScrewboxUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Screwbox.storekit
    test:
      config: Debug
      storeKitConfiguration: Screwbox.storekit
      targets:
        - ScrewboxTests
        - ScrewboxUITests
    archive:
      config: Release
